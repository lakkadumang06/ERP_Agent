# Render.com blueprint: "New +" -> "Blueprint" -> pick this repo. Free web service, Docker runtime.
services:
  - type: web
    name: erp-agent
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: groq                       # free tier; any configured provider can be chosen in the UI
      - key: GROQ_API_KEY
        sync: false                       # paste your key in the Render dashboard
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LANGSMITH_TRACING
        value: "false"
